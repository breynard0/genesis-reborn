<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <style>
            h1 {
                color: red;
            }
        </style>
    </head>
    <body>
        <h1>this is a test application!</h1>
        <script>
            document.querySelector("h1").addEventListener("click", () => {
                document.querySelector("h1").style.color = "blue";
            })
        </script>
    </body>
</html>
